AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda para gestión de Opciones de Producto - Sistema POS Atenea

Resources:
  OpcionesProductoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-ateneapos-opciones-producto
      CodeUri: src/
      Description: 'Lambda para API REST de Opciones de Producto - Sistema POS Atenea'
      MemorySize: 512
      Timeout: 30
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - arm64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          PG_HOST: db-atenea-pos.ctiw48myq04p.us-east-1.rds.amazonaws.com
          PG_USER: postgres
          PG_PASSWORD: KratosMilo123**
          PG_DATABASE: ateneapos
          PG_PORT: 5432
          NODE_ENVIRONMENT: DEV
          JWT_SECRET_PARAMETER_NAME: /ateneaall/jwt-secret
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
        - Statement:
            # Permisos para CloudWatch Logs
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource:
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/lambda-ateneapos-opciones-producto:*'

            # ═══════════════════════════════════════════════════════
            # PERMISOS CRÍTICOS: Leer JWT_SECRET de Parameter Store
            # ═══════════════════════════════════════════════════════
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ateneaall/jwt-secret'

            # PERMISO CRÍTICO: Desencriptar con KMS (para SecureString)
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: '*'
      SnapStart:
        ApplyOn: None
      Events:
        # ========== GRUPOS DE OPCIONES ==========
        CreateGrupoOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/productos/{productoId}/grupos-opciones
            Method: POST
        ListGruposOpcionesByProducto:
          Type: Api
          Properties:
            Path: /v1/pos/productos/{productoId}/grupos-opciones
            Method: GET
        GetGrupoOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/grupos-opciones/{grupoId}
            Method: GET
        UpdateGrupoOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/grupos-opciones/{grupoId}
            Method: PUT
        DeleteGrupoOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/grupos-opciones/{grupoId}
            Method: DELETE

        # ========== OPCIONES ==========
        CreateOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/grupos-opciones/{grupoId}/opciones
            Method: POST
        ListOpcionesByGrupo:
          Type: Api
          Properties:
            Path: /v1/pos/grupos-opciones/{grupoId}/opciones
            Method: GET
        GetOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/opciones/{opcionId}
            Method: GET
        UpdateOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/opciones/{opcionId}
            Method: PUT
        DeleteOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/opciones/{opcionId}
            Method: DELETE

        # ========== RECETAS DE OPCIONES ==========
        CreateOpcionReceta:
          Type: Api
          Properties:
            Path: /v1/pos/opciones/{opcionId}/receta
            Method: POST
        GetRecetaByOpcion:
          Type: Api
          Properties:
            Path: /v1/pos/opciones/{opcionId}/receta
            Method: GET
        UpdateOpcionReceta:
          Type: Api
          Properties:
            Path: /v1/pos/opciones/{opcionId}/receta/{insumoId}
            Method: PUT
        DeleteOpcionReceta:
          Type: Api
          Properties:
            Path: /v1/pos/opciones/{opcionId}/receta/{insumoId}
            Method: DELETE

        # ========== MODIFICADORES PREDEFINIDOS ==========
        CreateModificador:
          Type: Api
          Properties:
            Path: /v1/pos/modificadores
            Method: POST
        ListModificadoresByProducto:
          Type: Api
          Properties:
            Path: /v1/pos/productos/{productoId}/modificadores
            Method: GET
        ListModificadoresGlobales:
          Type: Api
          Properties:
            Path: /v1/pos/modificadores/globales
            Method: GET
        UpdateModificador:
          Type: Api
          Properties:
            Path: /v1/pos/modificadores/{modificadorId}
            Method: PUT
        DeleteModificador:
          Type: Api
          Properties:
            Path: /v1/pos/modificadores/{modificadorId}
            Method: DELETE
        # Configuración Completa
        GetProductoConfiguracionCompleta:
          Type: Api
          Properties:
            Path: /v1/pos/productos/{productoId}/configuracion-completa
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - app.ts
        External:
          - '@aws-sdk/client-ssm'

Outputs:
  ApiUrl:
    Description: URL del API Gateway para Opciones de Producto
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
  FunctionArn:
    Description: ARN de la función Lambda de Opciones de Producto
    Value: !GetAtt OpcionesProductoFunction.Arn
  FunctionName:
    Description: Nombre de la función Lambda
    Value: !Ref OpcionesProductoFunction
