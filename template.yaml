AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda para gestión de IVA - Sistema POS Atenea

Resources:
  IvaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-ateneaall-iva
      CodeUri: src/
      Description: 'Lambda para API REST de IVA - Sistema POS Atenea'
      MemorySize: 256
      Timeout: 10
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - arm64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          PG_HOST: db-atenea-pos.ctiw48myq04p.us-east-1.rds.amazonaws.com
          PG_USER: postgres
          PG_PASSWORD: KratosMilo123**
          PG_DATABASE: ateneaposall
          PG_PORT: 5432
          NODE_ENVIRONMENT: QA
          JWT_SECRET_PARAMETER_NAME: /ateneaall/jwt-secret
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
        - Statement:
            # Permisos para CloudWatch Logs
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource:
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/lambda-ateneaall-iva:*'

            # ═══════════════════════════════════════════════════════
            # PERMISOS CRÍTICOS: Leer JWT_SECRET de Parameter Store
            # ═══════════════════════════════════════════════════════
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ateneaall/jwt-secret'

            # PERMISO CRÍTICO: Desencriptar con KMS (para SecureString)
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: '*'
      SnapStart:
        ApplyOn: None
      Events:
        CreateIva:
          Type: Api
          Properties:
            Path: /v1/pos/ivas
            Method: POST
        ListIvas:
          Type: Api
          Properties:
            Path: /v1/pos/ivas
            Method: GET
        GetIva:
          Type: Api
          Properties:
            Path: /v1/pos/ivas/{ivaId}
            Method: GET
        UpdateIva:
          Type: Api
          Properties:
            Path: /v1/pos/ivas/{ivaId}
            Method: PUT
        PatchIva:
          Type: Api
          Properties:
            Path: /v1/pos/ivas/{ivaId}
            Method: PATCH
        DeleteIva:
          Type: Api
          Properties:
            Path: /v1/pos/ivas/{ivaId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - app.ts
        External:
          - '@aws-sdk/client-ssm'

Outputs:
  ApiUrl:
    Description: URL del API Gateway para IVA
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
  FunctionArn:
    Description: ARN de la función Lambda de IVA
    Value: !GetAtt IvaFunction.Arn
  FunctionName:
    Description: Nombre de la función Lambda
    Value: !Ref IvaFunction
